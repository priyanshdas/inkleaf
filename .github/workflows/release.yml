# Builds the installers for Windows and Linux (macOS is paused, see below) and publishes them to
# the public releases repository, which is where the installed app looks
# for updates. Runs when you push a version tag:
#
#   git tag v3.0.0 && git push origin v3.0.0
#
# It also builds the Microsoft Store package (.appx), kept with the run
# rather than published, for you to upload in Partner Center.
#
# Secrets (Settings › Secrets and variables › Actions):
#
#   RELEASES_TOKEN               required. A GitHub token that can create
#                                releases in priyanshdas/inkleaf-releases.
#
#   For a signed, notarised Mac app (without these, the Mac build is only
#   ad-hoc signed and macOS warns people the first time they open it):
#   MAC_CERTIFICATE              your "Developer ID Application" certificate,
#                                exported as .p12 and base64-encoded
#   MAC_CERTIFICATE_PASSWORD     the password you gave the .p12
#   APPLE_ID                     the Apple ID email of your developer account
#   APPLE_APP_SPECIFIC_PASSWORD  made at account.apple.com › App-Specific Passwords
#   APPLE_TEAM_ID                the 10-character team ID from developer.apple.com
#
#   Optional, for a signed Windows installer:
#   WIN_CERTIFICATE, WIN_CERTIFICATE_PASSWORD
#
#   For the Android app (without these, only an unsigned build is attached,
#   which phones refuse to install, so set them before your first 3.x release):
#   ANDROID_KEYSTORE             your upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD    the keystore's password
#   ANDROID_KEY_ALIAS            the key's alias inside it
#   ANDROID_KEY_PASSWORD         the key's password (often the same)
name: Release

on:
  push:
    tags: ['v*', 'V*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS is paused until the Apple Developer account and signing are
        # ready; add macos-latest back to this list to build it again
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || secrets.WIN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then
            # no certificate yet: ad-hoc sign so the app still opens on Apple Silicon
            npm run release -- -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          else
            npm run release
          fi

      # The Microsoft Store package. It isn't put on the releases page (the
      # Store signs it, so on its own it won't install); download it from
      # this run's summary page and upload it in Partner Center.
      - name: Store package
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win appx --x64 --publish never

      - name: Keep the Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Inkleaf-Microsoft-Store
          path: dist/*.appx
          if-no-files-found: error

  # The Android app: an APK people can install straight from the releases page,
  # and an app bundle (.aab) for the Play Store. Runs after the desktop builds,
  # which create the release this attaches to.
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build the phone app's pages
        run: |
          node scripts/build-mobile.mjs
          npx cap sync android

      - name: Build and sign
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          INKLEAF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INKLEAF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INKLEAF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            export INKLEAF_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "$KEYSTORE" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/Inkleaf-Android.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/Inkleaf-Android-unsigned.apk"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/Inkleaf-Android.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        # the desktop builds name the release after package.json's version
        run: gh release upload "v$(node -p "require('./package.json').version")" out/* --repo priyanshdas/inkleaf-releases --clobber