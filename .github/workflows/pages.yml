name: Deploy Inkleaf Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Flatpak repository (see flatpak.yml), from the newest release that
      # has one, so installed Flatpaks keep finding their updates
      - name: Add the Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --repo priyanshdas/inkleaf-releases --limit 10 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --repo priyanshdas/inkleaf-releases --pattern inkleaf-flatpak-repo.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
              mkdir -p website/flatpak
              tar -xzf "$RUNNER_TEMP/inkleaf-flatpak-repo.tar.gz" -C website/flatpak
              echo "Flatpak repository from $tag"
              break
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "./website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
