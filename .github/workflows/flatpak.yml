# Builds the Flatpak from a release's .deb and publishes it two ways:
#
#   - a Flatpak repository on the website, priyanshdas.github.io/inkleaf/flatpak,
#     where installed copies get their updates
#   - InkLeaf-PDF.flatpak on the releases page, which installs the app and
#     adds that repository
#
# It runs by itself after every release (release.yml calls it). To build it
# for a release that's already out, open Actions › Flatpak › Run workflow and
# type the version, for example 3.3.0.
#
# Secrets:
#   FLATPAK_GPG_KEY   the private key that signs the repository, exported with
#                     gpg --armor --export-secret-keys "InkLeaf PDF Flatpak".
#                     Keep a backup: a different key means every installed
#                     copy stops updating.
#   RELEASES_TOKEN    the same token release.yml uses
name: Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 3.3.0 (a v in front is fine too)
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      FLATPAK_GPG_KEY:
        required: true
      RELEASES_TOKEN:
        required: true

env:
  VERSION: ${{ inputs.version }}
  SITE: https://priyanshdas.github.io/inkleaf/flatpak

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: The release's .deb
        run: |
          echo "TAG=v${VERSION#[vV]}" >> "$GITHUB_ENV"
          TAG="v${VERSION#[vV]}"
          curl -fsSL -o packaging/flatpak/Inkleaf-linux-amd64.deb \
            "https://github.com/priyanshdas/inkleaf-releases/releases/download/$TAG/Inkleaf-linux-amd64.deb"

      - name: Build and sign
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -eu
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --import
          id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --export "$id" > key.gpg

          # this version in the app's list of releases, if it isn't there yet
          version="${TAG#v}"
          meta=packaging/flatpak/io.github.priyanshdas.inkleaf.metainfo.xml
          grep -q "version=\"$version\"" "$meta" || sed -i "s|<releases>|<releases>\n    <release version=\"$version\" date=\"$(date -u +%F)\"/>|" "$meta"

          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --default-branch=stable --gpg-sign="$id" --repo=site/repo build-dir \
            packaging/flatpak/io.github.priyanshdas.inkleaf.yml
          flatpak build-update-repo --gpg-sign="$id" --title="InkLeaf PDF" --default-branch=stable site/repo

          # one file that installs the app and adds the repository for updates
          flatpak build-bundle --gpg-keys=key.gpg --repo-url="$SITE/repo/" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            site/repo InkLeaf-PDF.flatpak io.github.priyanshdas.inkleaf stable

          # the files software centres open: one for the app, one for the repository
          key=$(base64 -w0 key.gpg)
          printf '%s\n' '[Flatpak Ref]' 'Name=io.github.priyanshdas.inkleaf' 'Branch=stable' 'Title=InkLeaf PDF' \
            "Url=$SITE/repo/" 'RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo' 'IsRuntime=false' \
            "GPGKey=$key" > site/inkleaf-pdf.flatpakref
          printf '%s\n' '[Flatpak Repo]' 'Title=InkLeaf PDF' "Url=$SITE/repo/" \
            'Homepage=https://priyanshdas.github.io/inkleaf/' "GPGKey=$key" > site/inkleaf-pdf.flatpakrepo

          tar -czf inkleaf-flatpak-repo.tar.gz -C site .

      - uses: actions/upload-artifact@v4
        with:
          name: inkleaf-flatpak
          path: |
            InkLeaf-PDF.flatpak
            inkleaf-flatpak-repo.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inkleaf-flatpak

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "v${VERSION#[vV]}" InkLeaf-PDF.flatpak inkleaf-flatpak-repo.tar.gz --repo priyanshdas/inkleaf-releases --clobber

      # the website build unpacks the repository from the newest release that has one
      - name: Update the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
