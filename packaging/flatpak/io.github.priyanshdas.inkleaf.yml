# Flatpak manifest for InkLeaf PDF. It repackages the release .deb (the same
# approach as most Electron apps), so it needs no change to the normal build.
#
# The release workflow builds it from the .deb it has just made and publishes
# it at priyanshdas.github.io/inkleaf/flatpak, where installed copies get
# their updates. To build and install it on your own computer instead, put
# Inkleaf-linux-amd64.deb next to this file and run:
#
#   flatpak-builder --user --install --install-deps-from=flathub --force-clean build-dir packaging/flatpak/io.github.priyanshdas.inkleaf.yml
app-id: io.github.priyanshdas.inkleaf
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: inkleaf
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Only for the things that need it, each one asked for by the person:
  # the AI tools, network scanners, language packs, sending to a phone and
  # web page to PDF. Opening and saving files never uses the network.
  - --share=network
  # Opening files goes through the file chooser and "Open with", so no wider
  # file access is needed. Downloads is read-only, for the setting that opens
  # a PDF as soon as it has been downloaded.
  - --filesystem=xdg-download:ro
  # notifications and the icon next to the clock
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: inkleaf
    buildsystem: simple
    build-commands:
      - ar x inkleaf.deb data.tar.xz
      - tar -xf data.tar.xz
      - mv opt/Inkleaf /app/inkleaf
      - install -Dm755 inkleaf.sh /app/bin/inkleaf
      - install -Dm644 io.github.priyanshdas.inkleaf.desktop -t /app/share/applications
      - install -Dm644 io.github.priyanshdas.inkleaf.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.priyanshdas.inkleaf.png
      - install -Dm644 /app/inkleaf/LICENSE.electron.txt -t /app/share/licenses/io.github.priyanshdas.inkleaf
    sources:
      - type: file
        path: Inkleaf-linux-amd64.deb
        dest-filename: inkleaf.deb
        only-arches: [x86_64]
      - type: script
        dest-filename: inkleaf.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/inkleaf/inkleaf "$@"
      - type: file
        path: icon-256.png
      - type: file
        path: io.github.priyanshdas.inkleaf.desktop
      - type: file
        path: io.github.priyanshdas.inkleaf.metainfo.xml
