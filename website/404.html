<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d10">
  <title>Page Not Found — Inkleaf</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0d10;
      color: #f1f1f1;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .error-page {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .code {
      margin: 0;
      color: #b7ff4a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0 16px;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 0.95;
      letter-spacing: -3px;
    }

    p {
      margin: 0 auto 30px;
      max-width: 440px;
      color: #777e87;
      font-size: 15px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 10px;
      background: #b7ff4a;
      color: #0b0d10;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(183, 255, 74, 0.15);
    }
  </style>
</head>

<body>
  <main class="error-page">
    <img src="icon-180.png" alt="Inkleaf" class="logo">

    <p class="code">ERROR 404</p>

    <h1>Lost in the document.</h1>

    <p>
      The page you're looking for doesn't exist or may have been moved.
      Let's get you back to Inkleaf.
    </p>

    <a href="./">
      Back to Inkleaf <span>→</span>
    </a>
  </main>
</body>
</html>
